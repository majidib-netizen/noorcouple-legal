<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NoorCouple - Nouveau mot de passe</title>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; max-width: 400px; margin: 60px auto; padding: 20px; color: #1A1A2E; text-align: center; }
  .subtitle { color: #6B7280; font-size: 14px; margin-bottom: 32px; }
  .logo { margin-bottom: 16px; }
  .logo img { width: 160px; height: auto; }
  input { width: 100%; padding: 14px; border: 2px solid #E4DDD4; border-radius: 10px; font-size: 16px; box-sizing: border-box; margin-bottom: 12px; outline: none; }
  input:focus { border-color: #0d9488; }
  button { width: 100%; padding: 14px; background: #0d9488; color: white; border: none; border-radius: 10px; font-size: 16px; font-weight: 700; cursor: pointer; margin-top: 8px; }
  button:hover { background: #0f766e; }
  button:disabled { background: #9CA3AF; cursor: not-allowed; }
  .message { margin-top: 16px; padding: 12px; border-radius: 8px; font-size: 14px; }
  .success { background: #ECFDF5; color: #065F46; border: 1px solid #A7F3D0; }
  .error { background: #FEF2F2; color: #991B1B; border: 1px solid #FECACA; }
  .info { background: #F9F7F4; color: #1B3A5C; border: 1px solid #C9A96E; }
</style>
</head>
<body>

<div class="logo">
  <img src="logo.png" alt="NoorCouple">
</div>

<p id="subtitle" class="subtitle">Chargement...</p>

<div id="form-container" style="display:none;">
  <input type="password" id="password" placeholder="Nouveau mot de passe (min. 6 caracteres)" minlength="6">
  <input type="password" id="password-confirm" placeholder="Confirmer le mot de passe">
  <button id="submit-btn" onclick="resetPassword()">Changer le mot de passe</button>
</div>

<div id="message" class="message" style="display:none;"></div>

<script src="https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
  const SUPABASE_URL = 'https://sebdcfelxbaojgrtkhmi.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNlYmRjZmVseGJhb2pncnRraG1pIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDQ2MzQwOTEsImV4cCI6MjA2MDIxMDA5MX0.dFOjx-s1veWvMsXuOesIBoK3pCz3BKGG12Gftobc7DY';

  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  function showMessage(text, type) {
    var msg = document.getElementById('message');
    msg.textContent = text;
    msg.className = 'message ' + type;
    msg.style.display = 'block';
  }

  // Parse hash or query params to find tokens
  function getParams() {
    var params = {};
    // Check hash first (#access_token=...&refresh_token=...)
    var hash = window.location.hash.substring(1);
    if (hash) {
      hash.split('&').forEach(function(part) {
        var kv = part.split('=');
        if (kv.length === 2) params[kv[0]] = decodeURIComponent(kv[1]);
      });
    }
    // Also check query string (?access_token=...)
    var query = window.location.search.substring(1);
    if (query) {
      query.split('&').forEach(function(part) {
        var kv = part.split('=');
        if (kv.length === 2) params[kv[0]] = decodeURIComponent(kv[1]);
      });
    }
    return params;
  }

  async function initPage() {
    var params = getParams();
    var subtitle = document.getElementById('subtitle');
    var accessToken = params['access_token'];
    var refreshToken = params['refresh_token'];

    console.log('URL params:', Object.keys(params));
    console.log('Has access_token:', !!accessToken);
    console.log('Has refresh_token:', !!refreshToken);

    if (accessToken && refreshToken) {
      // Set the session manually with the tokens from the URL
      try {
        var result = await sb.auth.setSession({
          access_token: accessToken,
          refresh_token: refreshToken
        });
        console.log('setSession result:', result.error ? result.error.message : 'OK');
        
        if (result.error) {
          subtitle.textContent = '';
          showMessage('Lien expire. Veuillez refaire une demande depuis l\'application.', 'error');
          return;
        }

        // Session established - show the form
        subtitle.textContent = 'Saisissez votre nouveau mot de passe';
        document.getElementById('form-container').style.display = 'block';
        return;
      } catch (e) {
        console.log('setSession error:', e.message);
        subtitle.textContent = '';
        showMessage('Erreur de session : ' + e.message, 'error');
        return;
      }
    }

    // No tokens in URL - check if already have a session
    try {
      var session = await sb.auth.getSession();
      if (session.data.session) {
        subtitle.textContent = 'Saisissez votre nouveau mot de passe';
        document.getElementById('form-container').style.display = 'block';
        return;
      }
    } catch (e) {
      console.log('getSession error:', e.message);
    }

    // No session at all
    subtitle.textContent = '';
    showMessage('Lien invalide ou expire. Veuillez refaire une demande de reinitialisation depuis l\'application NoorCouple.', 'error');
  }

  async function resetPassword() {
    var password = document.getElementById('password').value;
    var confirmPassword = document.getElementById('password-confirm').value;
    var btn = document.getElementById('submit-btn');

    if (!password || password.length < 6) {
      showMessage('Le mot de passe doit contenir au moins 6 caracteres.', 'error');
      return;
    }

    if (password !== confirmPassword) {
      showMessage('Les mots de passe ne correspondent pas.', 'error');
      return;
    }

    btn.disabled = true;
    btn.textContent = 'Modification en cours...';

    try {
      var result = await sb.auth.updateUser({ password: password });
      
      if (result.error) {
        showMessage('Erreur : ' + result.error.message, 'error');
        btn.disabled = false;
        btn.textContent = 'Changer le mot de passe';
      } else {
        document.getElementById('form-container').style.display = 'none';
        document.getElementById('subtitle').textContent = '';
        showMessage('Mot de passe modifie avec succes ! Vous pouvez retourner dans l\'application NoorCouple et vous connecter avec votre nouveau mot de passe.', 'success');
      }
    } catch (e) {
      showMessage('Erreur : ' + e.message, 'error');
      btn.disabled = false;
      btn.textContent = 'Changer le mot de passe';
    }
  }

  // Start
  initPage();
</script>

</body>
</html>
